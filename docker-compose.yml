services:

  spark-master:
    image: apache/spark:3.5.1
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./jobs:/opt/jobs
      - ./conf:/opt/spark/conf:ro
    networks:
      spark-net:
        aliases:
          - spark-driver
          - spark-master-spark
      hadoop-net:

  spark-worker-1:
    image: apache/spark:3.5.1
    container_name: spark-worker-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --cores 1 --memory 1024m --webui-port 8081
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    volumes:
      - ./jobs:/opt/jobs
    networks:
      - spark-net
      - hadoop-net

  spark-worker-2:
    image: apache/spark:3.5.1
    container_name: spark-worker-2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --cores 1 --memory 1024m --webui-port 8081
    depends_on:
      - spark-master
    ports:
      - "8082:8081"
    volumes:
      - ./jobs:/opt/jobs
    networks:
      - spark-net
      - hadoop-net

  spark-worker-3:
    image: apache/spark:3.5.1
    container_name: spark-worker-3
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --cores 1 --memory 1024m --webui-port 8081
    depends_on:
      - spark-master
    ports:
      - "8083:8081"
    volumes:
      - ./jobs:/opt/jobs
    networks:
      - spark-net
      - hadoop-net

  spark-client:
    image: apache/spark:3.5.1
    container_name: spark-client
    entrypoint: ["sleep", "infinity"]
    volumes:
      - ./jobs:/opt/jobs
      - ./jars:/opt/spark/work-dir/jars:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "4040:4040"
    networks:
      - spark-net
      - hadoop-net

networks:
  spark-net:
    driver: bridge
  hadoop-net:
    external: true
    name: hdfs-lab_hadoop-net


